name: Build profile

# Rebuilds the live sections of profile/README.md and the banner in profile/assets, then
# commits them if anything changed. See build_profile.py.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *' # every six hours

permissions:
  contents: write

concurrency:
  group: build-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_profile.py
      - name: Commit and push if changed
        run: |
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898275+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Nothing staged means nothing changed; any other commit failure fails the job.
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update profile"
          git push
